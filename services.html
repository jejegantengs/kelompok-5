    <style>
        

        
        

        .playlist {
            background: white; /* Latar belakang putih untuk playlist */
            border-radius: 10px; /* Sudut melengkung */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Bayangan */
            overflow: hidden; /* Menghindari overflow */
            transition: transform 0.3s; /* Transisi untuk efek hover */
        }

        .playlist:hover {
            transform: scale(1.05); /* Memperbesar saat hover */
        }

        iframe {
            width: 100%; /* Lebar penuh */
            height: 380px; /* Tinggi iframe */
            border: none; /* Menghilangkan border */
        }

        .playlist-title {
            padding: 10px;
            text-align: center; /* Memusatkan teks */
            font-size: 18px; /* Ukuran font judul */
            font-weight: bold; /* Bold untuk judul */
            color: #333; /* Warna teks */
        }
    </style>
